name: canary-model-gateway
services:
  litellm:
    image: canary-litellm:1.108.0
    build:
      context: ../../..
      dockerfile: deployment/brain/gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - ./runtime/provider.env
      - ./runtime/worker.env
    volumes:
      - ./runtime/gateway.yaml:/app/gateway.yaml:ro
    ports:
      - 127.0.0.1:4000:4000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
