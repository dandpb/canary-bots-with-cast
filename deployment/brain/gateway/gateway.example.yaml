model_list:
  - model_name: participant-a
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      num_retries: 0
    model_info:
      id: participant-a-deployment
  # Add one explicit alias/deployment per additional provider/model.
  # Set its provider-qualified LiteLLM model and credential environment reference.
router_settings:
  num_retries: 0
  max_fallbacks: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []
  cache_responses: false
litellm_settings:
  num_retries: 0
  fallbacks: []
  cache: false
  drop_params: false
  turn_off_message_logging: true
  set_verbose: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: gateway_policy.authenticate
