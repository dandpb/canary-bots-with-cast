name: canary-bots-wsl
services:
  litellm:
    profiles: [gateway]
    image: canary-litellm-ui:1.108.0
    build:
      context: ../..
      dockerfile: deployment/brain/gateway/Dockerfile.ui
    restart: unless-stopped
    env_file:
      - ./runtime/secrets/litellm-provider.env
      - ./runtime/secrets/litellm-worker.env
      - ./runtime/secrets/litellm-ui.env
      - ./runtime/secrets/litellm-redis.env
    environment:
      NUM_WORKERS: "1"
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    volumes:
      - ./runtime/config/litellm.yaml:/app/gateway.yaml:ro
    ports:
      - 127.0.0.1:4000:4000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
  litellm-redis:
    profiles: [gateway]
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: unless-stopped
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    env_file:
      - ./runtime/secrets/litellm-redis.env
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        case "$$REDIS_PASSWORD" in *[!0-9a-f]*|'') exit 1 ;; esac
        test "$${#REDIS_PASSWORD}" -eq 64
        printf '%s\n' \
          'bind 0.0.0.0' 'protected-mode yes' 'port 6379' \
          "requirepass $$REDIS_PASSWORD" 'dir /data' \
          'appendonly yes' 'appendfsync everysec' 'save ""' \
          'maxmemory 128mb' 'maxmemory-policy noeviction' > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - litellm-redis:/data
    healthcheck:
      test: [CMD-SHELL, 'test "$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning -h 127.0.0.1 -p 6379 ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 24
  litellm-db:
    profiles: [gateway]
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./runtime/secrets/litellm-db.env
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, litellm, -d, litellm]
      interval: 5s
      timeout: 3s
      retries: 30
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: canary
      MARIADB_USER: canary
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?local database password is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?local root password is required}
    volumes:
      - database:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
  game:
    image: canary-bots-wsl-game:local
    build:
      context: ../..
      dockerfile: deployment/wsl/Dockerfile.release
      target: game
      additional_contexts:
        gitmeta: ${BUILD_GIT_DIRECTORY:-../../.git}
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    environment:
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      GAME_PUBLIC_IP: ${GAME_PUBLIC_IP:-127.0.0.1}
      BOT_PLAYERS_ONLINE: ${BOT_PLAYERS_ONLINE:-500}
      CANARY_BRAIN_CONFIG: /etc/canary-brain/server.json
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:7171:7171
      - 127.0.0.1:7172:7172
      - 127.0.0.1:7173:7173
    volumes:
      - /home/daniel/canary-bots-wsl/deployment/wsl/runtime/config:/etc/canary-brain:ro
      - brain-socket:/run/canary-brain-wsl
      - /home/daniel/canary-bots-wsl/deployment/wsl/runtime/world/otservbr.otbm:/canary/data-otservbr-global/world/otservbr.otbm:ro
      - game-logs:/canary/logs
      - authored-data:/canary/data/bot/authored
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1',7173),2).close()"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s
  brain:
    profiles: [ai]
    image: canary-bots-wsl-brain:local
    build:
      context: ../..
      dockerfile: deployment/wsl/Dockerfile
      target: brain
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    ports:
      - 127.0.0.1:8091:8091
    depends_on:
      game:
        condition: service_healthy
    volumes:
      - /home/daniel/canary-bots-wsl/deployment/wsl/runtime/config/worker.json:/etc/canary-brain/worker.json:ro
      - /home/daniel/canary-bots-wsl/deployment/wsl/runtime/secrets/openai.env:/etc/canary-brain/openai.env:ro
      - brain-socket:/run/canary-brain-wsl
      - brain-state:/var/lib/canary-brain
  web:
    image: canary-bots-wsl-web:local
    build:
      context: ../..
      dockerfile: deployment/wsl/Web.Dockerfile
    restart: unless-stopped
    environment:
      CANARY_DB_HOST: database
      CANARY_DB_NAME: canary
      CANARY_DB_USER: canary
      CANARY_DB_PASSWORD: ${MARIADB_PASSWORD}
      CANARY_SERVER_NAME: Canary bots with cast - WSL
      CANARY_SERVER_IP: ${GAME_PUBLIC_IP:-127.0.0.1}
      CANARY_STATUS_PORT: 7173
      MYAAC_CLIENT_VERSION: 1500
      MYAAC_SITE_URL: http://127.0.0.1:8080
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - website-cache:/var/www/html/system/cache
      - ./runtime/store-images:/var/www/html/images/store:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1/]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
volumes:
  litellm-redis:
  litellm-db:
  database:
    name: canary-bots-wsl_database-seeded
  brain-socket:
  game-logs:
  authored-data:
  brain-state:
  website-cache:
