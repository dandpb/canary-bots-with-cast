# B1 companion playtest only (CORE_QA_PROFILE=b1), never stage 1 and never production.
# A second QA project next to the live canary-core-qa on the same Docker daemon: its own project
# name (so containers, volumes and network are canary-qa-b1-*), image tags, loopback host ports
# and CPU/memory limits. Always after compose.yaml; preflight.py renders and checks it.
# `!override` replaces the stage-1 port lists instead of merging them (Compose >= 2.24.4);
# an older Compose that merges them is refused by the preflight's port check.
name: canary-qa-b1
services:
  database:
    cpus: 1
    mem_limit: 2g
    # Same target as compose.yaml, so Compose replaces stage 1's runtime/initdb (merge by target): the fresh
    # canary-qa-b1_database volume runs runtime/initdb plus the B1 companion seed (B1_FIXTURE.md).
    volumes:
      - ./runtime/b1/initdb:/docker-entrypoint-initdb.d:ro

  game:
    image: canary-qa-b1-game:local
    cpus: 2
    mem_limit: 6g
    # B1 common budget: reviewed no-ops replace the image's bot_market_funding.lua (bank 100000000000 for every
    # bot at each start) and bot_market.lua (bot market offers that charge or pay bots), only in this project;
    # compose.yaml's binds and volumes stay (merge by target).
    volumes:
      - ./b1/bot_market_funding.lua:/canary/data/scripts/globalevents/bot_market_funding.lua:ro
      - ./b1/bot_market.lua:/canary/data/scripts/globalevents/bot_market.lua:ro
    environment:
      GAME_LOGIN_PORT: 27171
      GAME_PROTOCOL_PORT: 27172
      GAME_STATUS_PORT: 27173
    ports: !override
      - 127.0.0.1:27171:27171
      - 127.0.0.1:27172:27172
      - 127.0.0.1:27173:27173
    healthcheck:
      test: !override [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1',27173),2).close()"]

  web:
    image: canary-qa-b1-web:local
    cpus: 1
    mem_limit: 1g
    environment:
      CANARY_SERVER_NAME: Canary QA B1
      CANARY_LOGIN_PORT: 27171
      CANARY_GAME_PORT: 27172
      CANARY_STATUS_PORT: 27173
      MYAAC_SITE_URL: http://127.0.0.1:28080
    ports: !override
      - 127.0.0.1:28080:80
